name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web, API, and root E2E
        run: pnpm lint

      - name: Typecheck web, API, and root E2E
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API tests with local D1
        run: pnpm test:api

      - name: Build API Worker locally
        run: pnpm build:api

      - name: Build OpenNext Worker
        run: pnpm build:worker

      - name: Test Worker Service Binding and local D1
        run: pnpm test:integration

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke test
        run: pnpm test:e2e

      - name: Passkey authentication through Worker Service Binding and local D1
        run: pnpm test:e2e:auth
